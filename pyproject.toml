[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gits"
version = "0.1.0"
description = "GitHub content fetcher and sync CLI"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "yanxinwu946" }]
license = { text = "MIT" }

[project.scripts]
gits = "gits.cli:main"

[tool.setuptools]
packages = ["gits"]
