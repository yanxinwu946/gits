[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gits"
version = "0.1.0"
description = "GitHub content fetcher and sync CLI"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "yanxinwu946" }]
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.scripts]
gits = "gits.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gits*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"